version: '3.2'

volumes:
  redisdata:
    driver: local

  # influxdbdata:
  #   driver: local

  pg10data15:
    driver: local

  odoo15erpu-container-data:
    driver: local

  odoo15erpu-data:
    driver: local

  vscode-data:
    driver: local

services:
  redis:
    image: redis:latest
    volumes:
      - redisdata:/data

  # influxdb:
  #   image: influxdb:latest
  #   environment:
  #     - INFLUXDB_DB=telegraf
  #     - INFLUXDB_ADMIN_USER=admin
  #     - INFLUXDB_ADMIN_PASSWORD=admin
  #     - INFLUXDB_USER=telegraf
  #     - INFLUXDB_USER_PASSWORD=telegraf
  #   volumes:
  #     - influxdbdata:/data

  db-custom15:
    image: postgres:10.5
    ports:
      - "5555:5432"
    environment:
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
    volumes:
      - pg10data15:/var/lib/postgresql/data

  web-custom15:
    links:
      - db-custom15
      - redis
    tty: true
    image: erpukraine/custom:odoo-15.0ee-erpu-latest
    depends_on:
      - db-custom15
      - redis
    environment:
      - HOST=db-custom15
    ports:
      - "3000:3000"
      - "8069:8069"
    volumes:
      - ./:/mnt/erpu-addons:cached
      - odoo15erpu-container-data:/home/vscode/.local/share/Odoo
      - odoo15erpu-data:/var/lib/odoo
      - ./odoo.conf:/etc/odoo/odoo.conf
      - vscode-data:/home/vscode/.vscode-server
    command: odoo -d odoo15-payroll --workers=0
